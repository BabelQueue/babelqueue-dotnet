name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Test (writes results.json)
        env:
          BQ_CONFORMANCE_RESULTS: ${{ github.workspace }}/results.json
        run: dotnet test -c Release

      # Same gates as ci.yml, before anything is published: a tag on a commit CI never saw
      # must not ship an invalid or incomplete asset (ADR-0032 section 3).
      - name: Validate results.json against the schema
        run: |
          pipx run check-jsonschema==0.33.0 \
            --schemafile tests/BabelQueue.Core.Tests/conformance/schema/results.schema.json \
            results.json

      - name: Fail on missing bindings, missing sections or failing cases
        run: python3 scripts/check-conformance-results.py results.json tests/BabelQueue.Core.Tests/conformance/manifest.json

      - name: Pack
        run: dotnet pack src/BabelQueue.Core/BabelQueue.Core.csproj -c Release -o artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 1

      - name: Upload conformance results
        uses: actions/upload-artifact@v7
        with:
          name: conformance-results
          path: results.json
          if-no-files-found: error
          retention-days: 1

  # Runs only after build + tests passed. The only job (besides the dry run) that can request
  # an OIDC token, so third-party build/test code never sees ACTIONS_ID_TOKEN_REQUEST_*.
  publish:
    if: github.event_name == 'push'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: artifacts

      - name: Download conformance results
        uses: actions/download-artifact@v8
        with:
          name: conformance-results
          path: .

      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: results.json
          fail_on_unmatched_files: true

  # Manual dry run: exercises only the NuGet Trusted Publishing login (no test, pack, push
  # or GitHub release), so the nuget.org policy can be verified without cutting a version.
  verify-trusted-publishing:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Verify the short-lived API key was issued
        env:
          KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "Trusted Publishing login OK"
          else
            echo "Trusted Publishing login returned an empty API key" >&2
            exit 1
          fi
