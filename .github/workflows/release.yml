name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Test (writes results.json)
        env:
          BQ_CONFORMANCE_RESULTS: ${{ github.workspace }}/results.json
        run: dotnet test -c Release

      # Same gates as ci.yml, before anything is published: a tag on a commit CI never saw
      # must not ship an invalid or incomplete asset (ADR-0032 section 3).
      - name: Validate results.json against the schema
        run: |
          pipx run check-jsonschema==0.33.0 \
            --schemafile tests/BabelQueue.Core.Tests/conformance/schema/results.schema.json \
            results.json

      - name: Fail on missing bindings, missing sections or failing cases
        run: python3 scripts/check-conformance-results.py results.json tests/BabelQueue.Core.Tests/conformance/manifest.json

      - name: Pack
        run: dotnet pack src/BabelQueue.Core/BabelQueue.Core.csproj -c Release -o artifacts

      - name: Publish to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: results.json
          fail_on_unmatched_files: true
