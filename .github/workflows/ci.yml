name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      # Build also runs the Roslyn analyzers (latest-recommended); warnings are
      # errors, so a static-analysis finding fails the build.
      - name: Build (static analysis)
        run: dotnet build -c Release --no-restore

      - name: Test with coverage gate (>=90% line)
        run: dotnet test -c Release /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:Threshold=90 /p:ThresholdType=line /p:ThresholdStat=total

  conformance:
    name: Conformance suite in sync and results complete
    runs-on: ubuntu-latest
    env:
      BQ_CONFORMANCE_VERSION: "1.5.0"
      VENDOR_DIR: tests/BabelQueue.Core.Tests/conformance
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Fetch fetch.sh from the pinned conformance tag
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/fetch.sh" \
            "https://raw.githubusercontent.com/BabelQueue/conformance/v${BQ_CONFORMANCE_VERSION}/fetch.sh"
          chmod +x "$RUNNER_TEMP/fetch.sh"

      - name: Verify vendored conformance matches the release asset
        run: |
          # Downloads babelqueue-conformance-<version>.tar.gz, verifies it against SHA256SUMS,
          # then diffs it with the vendored copy (exit 1 on drift).
          "$RUNNER_TEMP/fetch.sh" --check "$BQ_CONFORMANCE_VERSION" "$VENDOR_DIR"

      - name: Test (writes results.json)
        env:
          BQ_CONFORMANCE_RESULTS: ${{ runner.temp }}/results.json
        run: dotnet test -c Release

      - name: Validate results.json against the schema
        run: |
          pipx run check-jsonschema==0.33.0 \
            --schemafile "$VENDOR_DIR/schema/results.schema.json" \
            "$RUNNER_TEMP/results.json"

      - name: Fail on missing bindings, missing sections or failing cases
        run: python3 scripts/check-conformance-results.py "$RUNNER_TEMP/results.json" "$VENDOR_DIR/manifest.json"

  ci-green:
    name: CI green
    runs-on: ubuntu-latest
    needs: [test, conformance]
    if: ${{ always() }}
    steps:
      - name: Fail if any required job did not pass
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
